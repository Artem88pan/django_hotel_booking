services:
  web:
    build: .

    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - RUNNING_IN_DOCKER=1
    depends_on:
      - db

    command: >
      sh -c "
        echo 'Ждём БД…' &&
        until nc -z db 5432; do sleep 1; echo -n '.'; done &&
        echo 'Миграция…' &&
        python manage.py migrate &&
        gunicorn booking_hotel.wsgi:application --bind 0.0.0.0:8000
      "

  db:
    image: postgres:14
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.docker

volumes:
  postgres_data:
